name: Build NodeLab APK

# Builds the app on GitHub's free build machines and puts the finished APK on the
# "Releases" page of this repository. Works with the project either unzipped in the
# repository or as the single file NodeLab.zip in the repository root.
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        id: find
        run: |
          set -e
          if [ -f settings.gradle ]; then
            ROOT=.
          elif [ -f NodeLab.zip ]; then
            unzip -q -o NodeLab.zip -d _unzipped
            ROOT=$(dirname "$(find _unzipped -name settings.gradle | head -n 1)")
          else
            echo "::error::Upload NodeLab.zip to the main page of this repository, then run this again."
            exit 1
          fi
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
          echo "Project folder: $ROOT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android build tools
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Build the APK
        working-directory: ${{ steps.find.outputs.root }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace -Pnodelab.ndk=26.1.10909125

      - name: Collect the APK
        run: |
          APK=$(find "${{ steps.find.outputs.root }}" -path "*outputs/apk/debug/*.apk" | head -n 1)
          test -n "$APK"
          cp "$APK" NodeLab-debug.apk
          ls -la NodeLab-debug.apk

      - name: Publish on the Releases page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "apk-${{ github.run_number }}" NodeLab-debug.apk \
            --target "${{ github.sha }}" \
            --title "NodeLab APK #${{ github.run_number }}" \
            --notes "Debug build. Download NodeLab-debug.apk, open it on your phone and tap Install."

      - uses: actions/upload-artifact@v4
        with:
          name: NodeLab-debug-apk
          path: NodeLab-debug.apk
