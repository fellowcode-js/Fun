// Doom on Wednesday — Quest standalone APK. All game code is C++ (../../src), built by CMake through the NDK.
plugins { id 'com.android.application' }

android {
    namespace 'com.doomonwednesday.game'
    compileSdk 34
    ndkVersion project.findProperty('dow.ndk') ?: '27.2.12479018'

    defaultConfig {
        applicationId 'com.doomonwednesday.game'
        minSdk 29          // Quest 2 and newer
        targetSdk 32       // what the Meta Horizon store expects for VR apps
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared' } }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug   // sideload-ready; swap in your own keystore for store uploads
        }
    }
    externalNativeBuild { cmake { path file('../../CMakeLists.txt') } }
    buildFeatures { prefab true }
    lint { checkReleaseBuilds false; abortOnError false }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    // Khronos OpenXR loader (prefab AAR from Maven Central). It is the standard loader, not a game engine.
    implementation 'org.khronos.openxr:openxr_loader_for_android:1.1.49'
}
